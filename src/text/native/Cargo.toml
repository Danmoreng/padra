[package]
name = "mellum16-native-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "mellum16_native_text"
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "=0.22.1", default-features = false, features = ["onig"] }
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
